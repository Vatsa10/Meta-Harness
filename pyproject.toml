[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-harness"
version = "0.2.0"
description = "Meta-Harness: end-to-end optimization of LLM harnesses over an experience filesystem"
requires-python = ">=3.10"
dependencies = ["tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
meta-harness = "meta_harness.__main__:main"

[tool.setuptools.packages.find]
include = ["meta_harness*"]

[tool.setuptools.package-data]
meta_harness = ["*.md", "demo_data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["refs", "keel", ".claude", ".superpowers", "data", ".git", "*.egg-info", "venv"]
