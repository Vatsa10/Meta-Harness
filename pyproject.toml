[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-harness"
version = "0.1.0"
description = "Filesystem-backed end-to-end optimization of executable LLM harnesses"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["meta_harness*"]
