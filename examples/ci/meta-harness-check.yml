name: meta-harness check

# Blocks a pull request whose candidate harness regresses against the baseline.
# Uses only actions/checkout and actions/setup-python. Add the provider API key as a repository
# secret (here PROVIDER_API_KEY) and adjust the paths, metric, provider and model below.
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install meta-harness
        run: python -m pip install .
      - name: Fetch the baseline harness from the PR base
        run: git show "origin/${{ github.base_ref }}:harnesses/current.py" > baseline.py
      - name: Run the gate
        env:
          UNIKEY_API_KEY: ${{ secrets.PROVIDER_API_KEY }}
        run: |
          set +e
          meta-harness check \
            --baseline baseline.py \
            --candidate harnesses/current.py \
            --data eval/fixed.jsonl \
            --metric exact \
            --provider unikey --model gpt-5-mini \
            --repeats 3 --max-drop 0.02 --max-cost-increase 0.10 --alpha 0.05 \
            --out check.json --markdown summary.md
          code=$?
          if [ -f summary.md ]; then cat summary.md >> "$GITHUB_STEP_SUMMARY"; fi
          exit $code
      - name: Keep the report
        if: always()
        run: echo "check.json and summary.md are in the workspace; add an upload step if you want them kept."
